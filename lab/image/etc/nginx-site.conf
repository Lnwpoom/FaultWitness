# An External Site: HTTPS only, no TLS session reuse so every Probe test sees the current certificate.
worker_processes 1;
error_log stderr warn;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
  access_log off;
  server {
    listen 443 ssl;
    ssl_certificate /lab/active/cert.pem;
    ssl_certificate_key /lab/active/key.pem;
    ssl_session_cache off;
    ssl_session_tickets off;
    location / { default_type text/plain; return 200 "ok\n"; }
  }
}

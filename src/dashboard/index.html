<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FaultWitness — แดชบอร์ด</title>
<!--
  The Collector serves this page at GET /. One static file, no build step and no external
  requests: it polls GET /report every 2 s and renders the JSON report (src/shared/types.ts,
  `Report` / `NoDataReport`). Rendering follows the prototype's renderDash
  (prototypes/network-projects/PROTOTYPE-faultwitness.html); so do the colour tokens.
-->
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --accent:#0f766e; --accent-soft:#e6f4f1; --warn:#b45309; --warn-soft:#fffbeb; --bad:#b91c1c; --bad-soft:#fef2f2; --ok:#15803d; --ok-soft:#ecfdf3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#3a3532; --card:#262220; --accent:#5eead4; --accent-soft:#163532; --warn:#fbbf24; --warn-soft:#3a2f12; --bad:#f87171; --bad-soft:#3b1a1a; --ok:#4ade80; --ok-soft:#14301f; } }
  * { box-sizing:border-box; }
  html { font-size:15px; }
  @media (min-width:1280px) { html { font-size:17px; } }
  @media (min-width:1700px) { html { font-size:19px; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:1rem/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif; }
  main { max-width:1680px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:1.45rem; margin:0; line-height:1.3; }
  h2 { font-size:1.1rem; margin:0 0 10px; }
  h3 { font-size:.8rem; letter-spacing:.04em; color:var(--muted); margin:14px 0 4px; font-weight:600; }
  p { margin:0 0 8px; }
  ul { margin:0; padding-left:1.2em; }
  li + li { margin-top:2px; }
  .muted { color:var(--muted); } .small { font-size:.86rem; }
  .v-ok { color:var(--ok); } .v-bad { color:var(--bad); } .v-warn { color:var(--warn); }

  header { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  header .sub { color:var(--muted); font-size:.9rem; }
  .actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:6px 14px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.55; cursor:progress; }
  button.primary { border-color:var(--accent); background:var(--accent); color:var(--bg); font-weight:700; padding:8px 20px; font-size:1.05rem; }
  .live { font-size:.82rem; color:var(--muted); }
  .live::before { content:""; display:inline-block; width:.55em; height:.55em; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:middle; }
  .live.off::before { background:var(--bad); }

  .notice { border:1px solid var(--line); border-left-width:4px; border-radius:6px; padding:8px 12px; margin:0 0 14px; font-size:.92rem; }
  .notice.bad { border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
  .notice.warn { border-color:var(--warn); background:var(--warn-soft); color:var(--warn); }
  .notice[hidden] { display:none; }

  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; overflow-x:auto; }

  .hero { border-left:8px solid var(--ok); }
  .hero.bad { border-left-color:var(--bad); }
  .hero.warn { border-left-color:var(--warn); }
  .hero-top { display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between; }
  .hero .label { font-size:.85rem; color:var(--muted); }
  .big { font-size:2.2rem; font-weight:800; line-height:1.25; }
  .big.ok { color:var(--ok); } .big.bad { color:var(--bad); } .big.warn { color:var(--warn); }
  .alert { display:inline-block; padding:4px 16px; border-radius:999px; font-size:1.05rem; font-weight:600; border:2px solid var(--line); color:var(--muted); white-space:nowrap; }
  .alert.on { background:var(--bad); color:#fff; border-color:var(--bad); }
  .alert.watch { color:var(--warn); border-color:var(--warn); }
  .alert.stale { color:var(--warn); border-color:var(--warn); background:var(--warn-soft); }
  .meta { display:flex; flex-wrap:wrap; gap:8px 26px; margin-top:12px; font-size:.95rem; }
  .meta b { font-variant-numeric:tabular-nums; }
  .stale-banner { margin-top:12px; padding:10px 14px; border-radius:6px; background:var(--warn-soft); color:var(--warn); border:2px solid var(--warn); font-weight:600; }

  .grid { display:grid; grid-template-columns:1fr; gap:0 16px; align-items:start; }
  @media (min-width:1200px) { .grid { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); } }

  .finding { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-top:10px; }
  .finding:first-of-type { margin-top:0; }
  .finding .head { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:6px; }
  .finding .title { font-weight:700; font-size:1.08rem; }
  .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:4px 16px; }
  .tag { display:inline-block; padding:1px 10px; border-radius:999px; font-size:.82rem; border:1px solid var(--line); }
  .tag.st { background:var(--accent-soft); border-color:transparent; }
  .tag.lv-initial { color:var(--muted); } .tag.lv-repeated { color:var(--warn); border-color:var(--warn); } .tag.lv-confirmed { color:var(--ok); border-color:var(--ok); }
  .allgood { padding:10px 14px; border-radius:6px; background:var(--ok-soft); color:var(--fg); border-left:4px solid var(--ok); }
  .obs { margin-top:10px; padding:8px 12px; border-left:3px solid var(--warn); background:var(--warn-soft); border-radius:4px; font-size:.95rem; }
  .dim { opacity:.5; }

  table { border-collapse:collapse; width:100%; font-size:.92rem; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  td.okc { color:var(--ok); } td.badc { color:var(--bad); font-weight:600; } td.skip { color:var(--muted); }
  .probe-h { color:var(--fg); font-weight:700; }
  .nw, td.okc, td.skip { white-space:nowrap; }
  .num { font-variant-numeric:tabular-nums; }
  table.raw { font-size:.8rem; font-family:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  details summary { cursor:pointer; color:var(--muted); }

  .empty { text-align:center; padding:48px 16px; }
  .empty .big { color:var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>FaultWitness</h1>
      <div class="sub">ระบบรวบรวมหลักฐานเพื่อหาบริเวณที่เน็ตมีปัญหา · Probe A และ B ตรวจพร้อมกันทุกรอบ</div>
    </div>
    <div class="actions">
      <span id="live" class="live">กำลังเชื่อมต่อ…</span>
      <button id="check" class="primary" type="button">ตรวจเดี๋ยวนี้</button>
    </div>
  </header>
  <div id="conn" class="notice bad" role="status" hidden></div>
  <div id="dash"><div class="panel empty"><div class="big">กำลังโหลด…</div></div></div>
</main>

<script>
'use strict';

// ---- Thai labels (duplicated from src/diagnosis/labels.ts; this page has no build step) ----
const TN = { 'local-service': 'บริการภายใน', 'site-x': 'เว็บไซต์ X', 'site-y': 'เว็บไซต์ Y' };
const ERR = {
  timeout: 'หมดเวลา',
  refused: 'ถูกปฏิเสธการเชื่อมต่อ',
  dns_timeout: 'DNS ไม่ตอบ',
  dns_error: 'แปลงชื่อไม่ได้',
  tls_cert: 'ใบรับรองไม่ผ่าน',
  http_status: 'ตอบสถานะผิดปกติ',
};
const EXTERNAL = ['site-x', 'site-y'];
const PROBES = ['A', 'B'];
const POLL_MS = 2000;

const TABLE_ROWS = [['local-service', 'http', 'HTTP บริการภายใน'],
  ...EXTERNAL.flatMap((t) => [[t, 'http', `HTTPS ${TN[t]} (ใช้ชื่อโฮสต์)`], [t, 'dns', `DNS lookup ${TN[t]}`], [t, 'tcp', `TCP ไป IP:443 ของ ${TN[t]}`]])];

// ---- helpers ----
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
const secs = (ms) => Math.max(0, Math.round(ms / 1000));
const list = (items) => items.length ? `<ul>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<ul><li class="muted">—</li></ul>';

// ---- rendering (follows the prototype's renderDash) ----
function renderNoData() {
  return `<div class="panel empty">
    <div class="big">ยังไม่มีผลตรวจ</div>
    <p class="muted" style="margin-top:8px">เครื่องหลักยังไม่ได้รับผลการตรวจจาก Probe ใดเลย · รอบตรวจถัดไปจะเริ่มเองภายในไม่กี่วินาที หรือกด “ตรวจเดี๋ยวนี้”</p>
  </div>`;
}

function cell(r, p, t, test, reported) {
  if (!reported.has(p)) return '<td class="skip">ไม่มีผล</td>';
  const x = r.results.find((y) => y.probe_id === p && y.target === t && y.test === test);
  if (!x) return '<td class="skip">— ไม่ได้ตรวจ (ไม่จำเป็น)</td>';
  return x.success
    ? `<td class="okc num">✓ ${esc(x.duration_ms)} ms</td>`
    : `<td class="badc num"><span class="nw">✗ ${esc(ERR[x.error_type] || x.error_type)}</span> <span class="nw">· ${esc(x.duration_ms)} ms</span></td>`;
}

function probeHeader(r, p) {
  const info = r.probes.find((x) => x.probe_id === p);
  if (!info) return `<th>Probe ${esc(p)}</th>`;
  const cls = info.state === 'lost' ? 'v-bad' : info.state === 'silent' ? 'v-warn' : 'v-ok';
  const seen = info.last_seen_ms === null ? 'ยังไม่เคยส่งผล' : `ผลล่าสุด ${secs(r.generated_at - info.last_seen_ms)} วินาทีที่แล้ว`;
  return `<th><span class="probe-h">Probe ${esc(p)}</span><div class="${cls} nw">${esc(info.state_label)}</div><div class="small muted num nw">${esc(seen)}</div></th>`;
}

function renderReport(r) {
  const age = secs(r.generated_at - r.finished_at);
  const problem = r.findings.some((f) => f.code !== 'insufficient' && f.code !== 'nodata');
  const cls = r.stale ? 'warn' : !r.findings.length ? 'ok' : problem ? 'bad' : 'warn';
  const alert = r.stale ? '<span class="alert stale">ข้อมูลไม่เป็นปัจจุบัน</span>'
    : r.alert ? '<span class="alert on">🔔 แจ้งเตือน</span>'
    : r.findings.length ? '<span class="alert watch">เฝ้าดู — พบครั้งแรก รอยืนยัน</span>'
    : '<span class="alert">ไม่มีแจ้งเตือน</span>';

  let h = `<section class="panel hero ${cls}">
    <div class="hero-top">
      <div><div class="label">สถานะรวม</div><div class="big ${cls}">${esc(r.overall)}</div></div>
      ${alert}
    </div>
    <div class="meta">
      <span>รอบ <b>${esc(r.round_id)}</b></span>
      <span>ตรวจเสร็จเมื่อ <b>${age}</b> วินาทีที่แล้ว</span>
      <span>รอบนี้ใช้ <b>${esc(r.tests_this_round)}</b> การทดสอบ · ตรวจทุกอย่างต้องใช้ <b>${esc(r.tests_if_full_sweep)}</b></span>
    </div>
    ${r.stale ? `<div class="stale-banner">⚠ ผลเก่า — ไม่มีผลใหม่มา ${age} วินาทีแล้ว จึงไม่แสดงผลรอบ ${esc(r.round_id)} เป็นสถานะปัจจุบัน · ข้อสรุปและตารางด้านล่างแสดงเพื่ออ้างอิงเท่านั้น</div>` : ''}
  </section>`;

  // left column: Findings and Observations
  let left = '';
  if (!r.findings.length && !r.stale) {
    left += `<div class="allgood">การทดสอบที่กำหนดผ่านจากทุกจุด · ใช้ ${esc(r.tests_this_round)} การทดสอบ ไม่ต้องตรวจ DNS/TCP เพิ่ม (ตรวจทุกอย่างต้องใช้ ${esc(r.tests_if_full_sweep)})</div>`;
  } else if (!r.findings.length) {
    left += '<p class="muted">ไม่มีข้อสรุปในรอบล่าสุด</p>';
  }
  for (const f of r.findings) {
    left += `<article class="finding ${r.stale ? 'dim' : ''}">
      <div class="head"><span class="tag st">${esc(f.status)}</span><span class="tag lv-${esc(f.evidence_level)}">หลักฐาน: ${esc(f.evidence_level_label)} · พบ ${esc(f.rounds_seen)} รอบ</span></div>
      <div class="title">${esc(f.title)}</div>
      <div class="cols">
        <div><h3>หลักฐานที่สนับสนุน</h3>${list(f.supporting)}</div>
        <div><h3>หลักฐานที่ยังขาด</h3>${list(f.missing)}</div>
        <div><h3>ตรวจต่อที่แนะนำ</h3>${list(f.next_steps)}</div>
      </div>
    </article>`;
  }
  for (const o of r.observations) {
    left += `<div class="obs ${r.stale ? 'dim' : ''}"><b>ข้อสังเกต (ไม่ใช่ข้อสรุป):</b> ${esc(o.text)}${o.next_steps.length ? `<br><span class="muted">ตรวจต่อ: ${o.next_steps.map(esc).join(' · ')}</span>` : ''}</div>`;
  }

  // right column: Probe A vs B, built from the latest Round's Results
  const reported = new Set(r.results.map((x) => x.probe_id));
  const right = `<h2>Probe A เทียบ Probe B · รอบ ${esc(r.round_id)}</h2>
    <table class="${r.stale ? 'dim' : ''}">
      <tr><th>การตรวจ</th>${PROBES.map((p) => probeHeader(r, p)).join('')}</tr>
      ${TABLE_ROWS.map(([t, test, label]) => `<tr><td>${esc(label)}</td>${PROBES.map((p) => cell(r, p, t, test, reported)).join('')}</tr>`).join('')}
    </table>
    <p class="muted small" style="margin-top:8px">รอบนี้ใช้ ${esc(r.tests_this_round)} การทดสอบ · ตรวจทุกอย่างต้องใช้ ${esc(r.tests_if_full_sweep)} · DNS/TCP ทำเฉพาะปลายทางภายนอกที่ HTTP ไม่ผ่าน และทำทั้งสองจุดเพื่อใช้เทียบกัน</p>`;

  const cols = ['probe_id', 'round_id', 'target', 'test', 'success', 'duration_ms', 'error_type', 'started_at', 'finished_at'];
  const raw = `<details id="raw"${rawOpen ? ' open' : ''}><summary>ผลการตรวจดิบของรอบ ${esc(r.round_id)} (${r.results.length} แถว — ข้อมูลที่ตัววิเคราะห์ได้รับ)</summary>
    <div style="overflow-x:auto"><table class="raw" style="margin-top:6px"><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr>
    ${r.results.map((x) => `<tr>${cols.map((c) => `<td>${esc(x[c] === null ? 'null' : x[c])}</td>`).join('')}</tr>`).join('')}</table></div></details>`;

  return `${h}<div class="grid">
    <section class="panel"><h2>ข้อสรุปและข้อสังเกต</h2>${left}</section>
    <section class="panel">${right}</section>
  </div>
  <section class="panel">${raw}</section>`;
}

// ---- state, polling and the check-now button ----
let rawOpen = false;
let lastGeneratedAt = -Infinity;
let lastOkAt = null;
let pending = false;

const dash = document.getElementById('dash');
const conn = document.getElementById('conn');
const live = document.getElementById('live');
const btn = document.getElementById('check');

dash.addEventListener('toggle', (e) => { if (e.target.id === 'raw') rawOpen = e.target.open; }, true);

function show(report, force) {
  if (!report || report.status === 'no-data') {
    lastGeneratedAt = -Infinity;
    dash.innerHTML = renderNoData();
    return;
  }
  // A poll that left before a POST /rounds may answer after it; never step back to an older report.
  if (!force && report.generated_at < lastGeneratedAt) return;
  lastGeneratedAt = report.generated_at;
  dash.innerHTML = renderReport(report);
}

function setConnection(ok, msg) {
  if (ok) {
    lastOkAt = Date.now();
    conn.hidden = true;
    live.className = 'live';
    live.textContent = 'อัปเดตอัตโนมัติทุก 2 วินาที';
  } else {
    const since = lastOkAt === null ? '' : ` · ข้อมูลบนจอได้รับล่าสุดเมื่อ ${secs(Date.now() - lastOkAt)} วินาทีที่แล้ว`;
    conn.hidden = false;
    conn.textContent = `${msg}${since}`;
    live.className = 'live off';
    live.textContent = 'ขาดการเชื่อมต่อ';
  }
}

async function getJson(url, init) {
  const res = await fetch(url, { cache: 'no-store', ...init });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function poll() {
  try {
    show(await getJson('report'), false);
    setConnection(true);
  } catch {
    setConnection(false, '⚠ เชื่อมต่อเครื่องหลักไม่ได้ — กำลังลองใหม่');
  } finally {
    setTimeout(poll, POLL_MS);
  }
}

btn.addEventListener('click', async () => {
  if (pending) return;
  pending = true;
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจ…';
  try {
    show(await getJson('rounds', { method: 'POST' }), true);
    setConnection(true);
  } catch {
    setConnection(false, '⚠ สั่งตรวจไม่สำเร็จ — เชื่อมต่อเครื่องหลักไม่ได้');
  } finally {
    pending = false;
    btn.disabled = false;
    btn.textContent = 'ตรวจเดี๋ยวนี้';
  }
});

poll();
</script>
</body>
</html>
